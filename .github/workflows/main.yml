
name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o "*.zip" || true
          unzip -o "project-bolt-sb-*.zip" || true
          find . -maxdepth 3 -type d -name "project-bolt*" -exec cp -r {}/* . \; 2>/dev/null || true
          ls -la
      - run: rm -rf *.zip project-bolt* __MACOSX || true
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add .
          git commit -m "extracted" || true
          git push
